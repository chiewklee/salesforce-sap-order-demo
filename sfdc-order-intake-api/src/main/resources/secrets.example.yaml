# Copy this file to secrets.yaml (same folder) and fill in your values.
# secrets.yaml is gitignored; config.yaml holds the non-secret settings.
systemApi:
  # Host of the SAP Order System API, no scheme or path.
  # Local: localhost (and set protocol HTTP / port 8091 in config.yaml).
  # CloudHub 2.0: its public host, e.g. sap-order-system-api-xxxxxx.xxxxxx.usa-e1.cloudhub.io
  host: "localhost"
sfdc:
  username: "integration.user@your-org.example.com"
  password: "YOUR_SALESFORCE_PASSWORD"
  # Leave "" if the Mule host's IP is in the org's Trusted IP Ranges (or the
  # user's profile Login IP Ranges); otherwise paste the user's security token.
  securityToken: ""
